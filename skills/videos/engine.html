<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
:root{--ground:#0b1517;--ink:#e7dec8;--muted:#8fa4a2;--accent:#d04b40;--line:rgba(231,222,200,.16);--line2:rgba(231,222,200,.42);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink)}
[hidden]{display:none!important}
body{font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow:hidden}
#frame,#bar,#hint{width:min(100%,calc((100vh - 128px) * var(--ar,1.7778)))}
#frame{position:relative;aspect-ratio:var(--ar,1.7778);max-width:100%;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px var(--line);border-radius:3px;overflow:hidden;background:#10201f}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#start{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px;border:0;margin:0;padding:0;color:var(--ink);cursor:pointer;background:radial-gradient(ellipse at center,rgba(6,14,16,.08),rgba(6,14,16,.62));font:inherit}
#start .ring{width:92px;height:92px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:rgba(11,21,23,.4);transition:transform .2s}
#start:hover .ring,#start:focus-visible .ring{transform:scale(1.06)}
#start .tri{width:0;height:0;border-left:26px solid var(--accent);border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:8px}
#start .name{font-family:ui-serif,"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:clamp(28px,5.2vw,68px);margin:16px 0 2px;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#start .spec{color:var(--ink);opacity:.78;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
#bar button:hover{border-color:var(--line2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#track{flex:1 1 220px;position:relative;height:30px;display:grid;gap:3px;cursor:pointer;touch-action:none;user-select:none}
#track .seg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:2px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:6px}
#track .seg.on{border-color:var(--accent);color:var(--ink)}#track .seg.estrecho{color:transparent}
#head{position:absolute;top:-5px;left:0;width:2px;height:12px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
#tc{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
#hint{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
kbd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}
#bar button.ico{width:34px;height:34px;padding:0;display:grid;place-items:center}#bar button.ico svg{width:16px;height:16px}
html.fondo-claro #start{color:#1B1F3B;background:radial-gradient(ellipse at center,rgba(255,255,255,.15),rgba(255,255,255,.6))}html.fondo-claro #start .ring{border-color:#1B1F3B;background:rgba(255,255,255,.55)}html.fondo-claro #start .name,html.fondo-claro #start .spec{color:#1B1F3B;text-shadow:0 1px 12px rgba(255,255,255,.8)}
html.bare body{padding:0;gap:0}html.bare #bar,html.bare #hint{display:none}html.bare #frame{width:100vw;height:100vh;box-shadow:none;border-radius:0}
html.incrustado body,html:fullscreen body{padding:0;gap:0}html.incrustado #hint,html:fullscreen #hint{display:none}html.incrustado #frame,html:fullscreen #frame{width:100vw;height:100vh;box-shadow:none;border-radius:0}
html.incrustado #bar,html:fullscreen #bar{position:fixed;inset:auto 0 0 0;width:auto;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .2s;z-index:5}
html.controles #bar{opacity:1}html.incrustado:not(.controles) #frame,html:fullscreen:not(.controles) #frame{cursor:none}
@media (max-width:640px){#bar button{padding:5px 10px;font-size:12px}#track{order:10;flex-basis:100%}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="film" aria-label="{{TITLE}}: {{SYNOPSIS}}"></canvas>
  <button id="start" aria-label="Play {{TITLE}} with sound"><span class="ring"><span class="tri"></span></span><span class="name">{{TITLE}}</span><span class="spec" id="spec"></span></button>
</div>
<div id="bar" role="toolbar" aria-label="Video controls">
  <button id="pp" class="ico" aria-pressed="false" aria-label="Play" title="Play"></button>
  <button id="rs" class="ico" aria-label="Restart" title="Restart"></button>
  <div id="track" aria-label="Scrub the video"><span id="head"></span></div>
  <span id="tc"></span>
  <button id="sm" class="ico" aria-label="Stop-motion" title="Stop-motion"></button>
  <button id="snd" class="ico" aria-label="Sound off" title="Sound off"></button>
  <button id="fs" class="ico" aria-label="Full screen" title="Full screen"></button>
</div>
<p id="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> one pose · <kbd>S</kbd> stop-motion/smooth · <kbd>1</kbd>–<kbd>9</kbd> shots · <kbd>M</kbd> mute</p>
<script>
// Inside a note (iframe) the video fills the whole space, and the controls appear on top when the mouse hovers over it.
if (window.self !== window.top) document.documentElement.classList.add('incrustado');
// Any error is written on top of the video, so it shows up in the review capture.
addEventListener('error', e => { const p = document.createElement('pre'); p.textContent = 'ERROR: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : ''); p.style.cssText = 'position:fixed;inset:auto 0 0 0;margin:0;padding:12px;background:#000;color:#ff5555;font:16px monospace;z-index:99;white-space:pre-wrap'; document.body.append(p); });
</script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  {{TITLE}} — a film drawn and scored entirely in code.
//  No images, samples or libraries: every pixel and every sound is made here (a narration
//  track, when there is one, is the only recorded audio). Size, frame rate and look come from
//  FORMAT; the length is the sum of the shots. With expo > 1 puppets hold each pose for
//  `expo` frames (stop motion) while the camera still moves on every frame.
// ═══════════════════════════════════════════════════════════════════════════
"use strict";
// ═══ YOUR FILM · FORMAT — size, frame rate, pose rate and post look (see ENGINE.md for the presets) ═══
const FORMAT = {
  w: 2560, h: 1440, fps: 60,
  expo: 5,                                   // frames each pose holds: 5 = stop motion at 12 poses/s, 1 = smooth animation
  post: { flicker: .05, grain: .6, vignette: 1, bg: '#0c1719' },
  ink: [12, 22, 25], light: [242, 234, 216], // what tone() darkens toward and lightens toward
  paper: .45,                                // default paper texture baked into every sprite (0 = flat)
  shadow: { dx: 6, dy: 9, blur: 11, a: .3 },  // default contact shadow of every sprite (null = none)
  pixel: false,                              // true: w×h is a pixel grid (e.g. 640×360), shown and exported without smoothing
  poster: null,                              // second shown before playback starts (the poster); null = frame 0
  safe: null,                                // { top, bottom, left, right } as fractions; only record.cjs --zonas draws it
};
const W = FORMAT.w, H = FORMAT.h, FPS = FORMAT.fps, EXPO = FORMAT.expo;
let DUR = 0, NF = 0; // set at boot from the shots
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smooth = (a, b, x) => { x = inv(a, b, x); return x * x * (3 - 2 * x); };
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const esine = t => .5 - .5 * Math.cos(PI * clamp(t, 0, 1));
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 7919, 668265263) ^ Math.imul((c | 0) + 104729, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13; return (h >>> 0) / 4294967296; };

// ── Perlin gradient noise ────────────────────────────────────────────────────
const noise = (() => {
  const r = rng(1337), p = new Uint8Array(512), gx = new Float32Array(256), gy = new Float32Array(256), perm = [];
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = r() * TAU; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1], ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    const u = fade(xf), v = fade(yf);
    const x1 = lerp(gx[aa] * xf + gy[aa] * yf, gx[ba] * (xf - 1) + gy[ba] * yf, u);
    const x2 = lerp(gx[ab] * xf + gy[ab] * (yf - 1), gx[bb] * (xf - 1) + gy[bb] * (yf - 1), u);
    return lerp(x1, x2, v) * 1.42;
  };
})();
const fbm = (x, y, o = 3) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f + i * 17.3, y * f - i * 9.1); f *= 2.03; a *= .5; } return s; };
// divergence-free flow: curl of a drifting noise potential (px/s per unit amp)
function curl(x, y, t, sc = .0032) {
  const X = x * sc, Y = y * sc, h = .015;
  const n = (a, b) => noise(a + t * .23, b - t * .31) + .5 * noise(a * 2.1 - t * .4 + 3.1, b * 2.1 + t * .2 + 5.2);
  return [(n(X, Y + h) - n(X, Y - h)) / (2 * h), -(n(X + h, Y) - n(X - h, Y)) / (2 * h)];
}

// ── colour ──────────────────────────────────────────────────────────────────
const C = {
  teal: '#467f85', tealL: '#5a9197', tealD: '#2f6369', tealDD: '#20484f', sky: '#43808a', skyL: '#4f8b92',
  navy: '#17404c', navyD: '#10313b', hill: '#1f4d5a', hillL: '#7fa6ad', hillLL: '#9dbfc3',
  red: '#cf4b40', redD: '#a93a34', redL: '#dd6254', coral: '#d05b55', coralL: '#df746a', coralD: '#b2463f',
  orange: '#de835d', ochre: '#cf9a48', terra: '#c86a47', pear: '#d9c46f', gold: '#d8a54a',
  cream: '#e4dbc4', creamL: '#efe8d6', creamD: '#c9bfa6', paper: '#ebe3cf', skin: '#e3d4b4', cheek: '#e39a8c',
  ink: '#15191b', inkS: '#262c2e', slate: '#46565c', floor: '#35494e', floorL: '#4a5f63', table: '#4c5a54', tableD: '#3b4843',
  bag: '#61736e', wing: '#5d777c', bark: '#2a1715', brown: '#5b3526', cork: '#a8744b', grey: '#8d9696', blueGrey: '#88a6a1', lightBlue: '#8aaeb3'
};
const hexA = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const INKC = FORMAT.ink, LIGHTC = FORMAT.light;
// tone(h, k): k<0 darkens toward teal-ink, k>0 lightens toward paper — keeps every shade inside the print palette
const tone = (h, k, a = 1) => { const c = hexA(h); return css(k < 0 ? mixc(c, INKC, -k) : mixc(c, LIGHTC, k), a); };

// ── canvas helpers ──────────────────────────────────────────────────────────
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const g2 = c => c.getContext('2d');

// hand-cut outline: subdivide each edge and nudge it with noise so nothing is ruler-straight
function cutPath(g, pts, { closed = true, amp = 1.2, step = 16, seed = 1, begin = true } = {}) {
  if (begin) g.beginPath();
  let first = true, k = 0; const n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[(i + 1) % n][0], y1 = pts[(i + 1) % n][1];
    const L = Math.hypot(x1 - x0, y1 - y0) || 1, s = Math.max(1, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
    for (let j = 0; j < s; j++) {
      const t = j / s, w = noise(seed * 7.13 + k * .31, seed * 3.7) * amp; k++;
      const x = lerp(x0, x1, t) + nx * w, y = lerp(y0, y1, t) + ny * w;
      if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
    }
  }
  if (!closed) g.lineTo(pts[n - 1][0], pts[n - 1][1]); else g.closePath();
}
function blobPath(g, cx, cy, rx, ry, { n = 56, amp = .03, seed = 1, rot = 0, begin = true, freq = 1.3 } = {}) {
  if (begin) g.beginPath();
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, r = 1 + amp * noise(Math.cos(a) * freq + seed * 1.7, Math.sin(a) * freq - seed * 2.3);
    const x = Math.cos(a) * rx * r, y = Math.sin(a) * ry * r, X = cx + x * cr - y * sr, Y = cy + x * sr + y * cr;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.closePath();
}
// smooth closed/open curve through points (Catmull-Rom → Bézier)
function curvePath(g, pts, closed = false, begin = true) {
  const n = pts.length; if (begin) g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) g.closePath();
}
// print-style line texture inside the current clip
function hatch(g, x, y, w, h, { gap = 6, ang = 0, col = '#000', a = .15, lw = 1, wob = 0, seed = 1, av = .6, seg = 36 } = {}) {
  const R = rng(seed); g.save(); g.lineWidth = lw; g.strokeStyle = col;
  const D = Math.hypot(w, h) / 2 + 6; g.translate(x + w / 2, y + h / 2); g.rotate(ang);
  for (let v = -D; v <= D; v += gap * (.75 + .5 * R())) {
    g.globalAlpha = a * (1 - av + av * R()); g.beginPath();
    for (let u = -D; u <= D + seg; u += seg) { const yy = v + (wob ? noise(u * .006 + seed, v * .04) * wob : 0); u === -D ? g.moveTo(u, yy) : g.lineTo(u, yy); }
    g.stroke();
  }
  g.restore();
}
function stipple(g, x, y, w, h, { n = 400, col = '#fff', r0 = .7, r1 = 1.8, a = .5, seed = 2, dens = null } = {}) {
  const R = rng(seed); g.save(); g.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h, q = R(), r = lerp(r0, r1, R()), al = a * (.35 + .65 * R());
    if (dens && q > dens(px, py)) continue;
    g.globalAlpha = al;
    if (r < 1.3) g.fillRect(px - r, py - r, r * 2, r * 2); else { g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill(); }
  }
  g.restore();
}
function withClip(g, pathFn, fn) { g.save(); pathFn(g); g.clip(); fn(g); g.restore(); }
// the first fraction u (by length) of a polyline: for lines that draw themselves on
function trimPath(pts, u) {
  if (u >= 1) return pts.slice(); if (u <= 0 || pts.length < 2) return [pts[0]];
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const d = u * L[L.length - 1], out = [pts[0]];
  for (let i = 1; i < pts.length; i++) { if (L[i] <= d) { out.push(pts[i]); continue; } const t = (d - L[i - 1]) / (L[i] - L[i - 1] || 1); out.push([lerp(pts[i - 1][0], pts[i][0], t), lerp(pts[i - 1][1], pts[i][1], t)]); break; }
  return out;
}

// ── text: system font stacks; a style may embed its own @font-face (boot waits for document.fonts.ready) ──
const FONTS = { serif: 'ui-serif, "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif', sans: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', mono: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace' };
// draws str (wrapped to maxW, '\n' breaks lines) and returns its box; bake it inside sprite() to give it the style's material
function drawText(g, str, x, y, { size = 64, font = FONTS.sans, weight = 600, style = '', col = '#15191b', align = 'center', base = 'middle', maxW = 0, lh = 1.15, track = 0, stroke = null, sw = 0 } = {}) {
  g.save(); g.font = `${style} ${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if ('letterSpacing' in g) g.letterSpacing = `${track}px`;
  const lines = [];
  for (const para of String(str).split('\n')) {
    if (!maxW) { lines.push(para); continue; }
    let cur = ''; for (const w of para.split(' ')) { const t = cur ? cur + ' ' + w : w; if (cur && g.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t; } lines.push(cur);
  }
  const L = size * lh, h = L * lines.length, y0 = base === 'top' ? y + L / 2 : base === 'bottom' ? y - h + L / 2 : y - h / 2 + L / 2;
  let wmax = 0;
  lines.forEach((ln, i) => { const yy = y0 + i * L; wmax = Math.max(wmax, g.measureText(ln).width); if (stroke) { g.strokeStyle = stroke; g.lineWidth = sw; g.lineJoin = 'round'; g.strokeText(ln, x, yy); } g.fillStyle = col; g.fillText(ln, x, yy); });
  g.restore();
  const bx = align === 'center' ? x - wmax / 2 : align === 'right' || align === 'end' ? x - wmax : x;
  return { x: bx, y: y0 - L / 2, w: wmax, h, lines: lines.length };
}

// ── shared textures ─────────────────────────────────────────────────────────
// film grain: fine light+dark specks, re-laid every exposure
const GRAIN = (() => {
  const s = 384, c = mk(s, s), g = g2(c), id = g.createImageData(s, s), d = id.data, R = rng(99);
  for (let i = 0; i < s * s; i++) {
    const v = R(), k = i * 4;
    if (v < .5) { d[k] = 8; d[k + 1] = 16; d[k + 2] = 18; d[k + 3] = (.5 - v) * 64; }
    else { d[k] = 250; d[k + 1] = 244; d[k + 2] = 228; d[k + 3] = (v - .5) * 44; }
  }
  g.putImageData(id, 0, 0); return c;
})();
// paper fibre: soft blotches + fibres, pressed into every cut-out
const PAPER = (() => {
  const s = 512, c = mk(s, s), g = g2(c), id = g.createImageData(s, s), d = id.data, R = rng(7);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const k = (y * s + x) * 4;
    // tileable blotch field
    const fx = x / s * TAU, fy = y / s * TAU;
    const v = noise(Math.cos(fx) * 2.2 + 11, Math.sin(fx) * 2.2 + Math.cos(fy) * 2.2) * .6 + noise(Math.cos(fx) * 6 + Math.sin(fy) * 6, Math.sin(fx) * 6 - 4) * .4 + (R() - .5) * .9;
    if (v < 0) { d[k] = 10; d[k + 1] = 20; d[k + 2] = 22; d[k + 3] = Math.min(255, -v * 70); }
    else { d[k] = 255; d[k + 1] = 248; d[k + 2] = 232; d[k + 3] = Math.min(255, v * 60); }
  }
  g.putImageData(id, 0, 0);

    const [sx, sy] = pos(ev), [x, y] = toWorld(sx, sy), now = performance.now(), dt = Math.max(8, now - lt) / 1000;

    if (film.playing && (down || sp > 900)) GUSTS.push({ x, y, vx: vx * (down ? .9 : .35), vy: vy * (down ? .9 : .35), r: down ? 230 : 160, s: down ? 1 : .5, push: 0 });

addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('button') && (ev.key === ' ' || ev.key === 'Enter')) return;

  else if (k === 'ArrowRight' || k === 'ArrowLeft') { ev.preventDefault(); if (!film.started) { $('start').hidden = true; film.started = true; } play(false); const step = ev.shiftKey ? 1 : film.smooth ? 1 : EXPO, base = film.smooth || ev.shiftKey ? film.f : Math.round(film.f / EXPO) * EXPO; seek(base + (k === 'ArrowRight' ? step : -step), false); }
  else if (k === 'r' || k === 'R' || k === 'Home') { if (!film.started) return startFilm(); seek(0); if (!film.playing) play(true); }
  else if (k === 's' || k === 'S') $('sm').click();
  else if (k === 'm' || k === 'M') $('snd').click();
  else if (k === 'f' || k === 'F') $('fs').click();
  else if (k >= '1' && k <= '9' && +k <= SHOTS.length) { if (!film.started) { $('start').hidden = true; film.started = true; film.audio = true; } seek(Math.round(SHOTS[+k - 1].t0 * FPS)); if (!film.playing) play(true); }
});

// ── boot ──
(async () => {
  let acc = 0; for (const s of SHOTS) { if (s.t0 == null) s.t0 = acc; if (s.t1 == null) s.t1 = s.t0 + s.dur; acc = s.t1; }
  DUR = acc; NF = Math.round(DUR * FPS);
  cv.width = W; cv.height = H; document.documentElement.style.setProperty('--ar', W / H);
  if (FORMAT.pixel) cv.style.imageRendering = 'pixelated';
  // With a light background style, the start screen lightens and the title turns to ink.
  { const h = FORMAT.post.bg.replace('#', ''), [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); if (.2126 * r + .7152 * g + .0722 * b > 128) document.documentElement.classList.add('fondo-claro'); }
  const tr = $('track'); tr.style.gridTemplateColumns = SHOTS.map(s => `${s.t1 - s.t0}fr`).join(' ');
  SHOTS.forEach(s => { const el = document.createElement('span'); el.className = 'seg'; el.textContent = s.name; el.title = s.name; tr.insertBefore(el, $('head')); });
  // A shot's name is written only if it fits whole; otherwise it stays in the title (on mouse hover).
  new ResizeObserver(() => tr.querySelectorAll('.seg').forEach(el => { el.classList.remove('estrecho'); el.classList.toggle('estrecho', el.scrollWidth > el.clientWidth + 1); })).observe(tr);

  if (EXPO === 1) $('sm').hidden = true;

  if (typeof KIT_READY !== 'undefined') await KIT_READY; // a kit that loads something async (3b1b: MathJax) awaits it here, before build()
  if (VOICE.length) { const O = new OfflineAudioContext(1, 1, 48000); for (const c of VOICE) { const b = atob(c.b64), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); c.buf = await O.decodeAudioData(u.buffer); } }

  if (Q.get('ui') === '0') document.documentElement.classList.add('bare');
  seek(fr != null ? +fr : t != null ? +t * FPS : FORMAT.poster != null ? Math.round(FORMAT.poster * FPS) : 0, false);
  film.ready = true; window.__READY = true;
  if (t != null || fr != null || Q.get('ui') === '0') { $('start').hidden = true; film.started = true; }
  requestAnimationFrame(tick);
})();
// test hooks (headless capture + review)
window.__film = {
  seek: f => { film.seeking = true; simTo(f); film.seeking = false; render(); return film.f; },
  time: () => { const t0 = performance.now(); render(); ctx.getImageData(0, 0, 1, 1); return performance.now() - t0; }, // waits for the GPU: measures the whole frame
  wav: () => renderWav(), score: () => SCORE, info: () => ({ f: film.f, shot: film.shot && film.shot.name, smooth: film.smooth }),
};
</script>
