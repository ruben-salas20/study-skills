<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB TITLE</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
} }
</script>

<body>
<!-- SCENE of the 3d-scenes skill. You write CONTENIDO, the <title> and this aria-label, which says what is shown; the rest is not touched. -->
<div class="escena3d" id="escena" data-modo="laboratorio" aria-label="WHAT IS SHOWN, IN ONE SENTENCE"></div>
<script>
  // If the module fails to start (no connection to the CDN, syntax error), say so instead of staying blank.
  setTimeout(() => { if (!document.body.dataset.listo && !document.getElementById("diag")) document.querySelector(".escena3d").insertAdjacentHTML("beforeend", '<p class="fallo3d sin-arrancar" style="padding:1rem">The 3D scene did not start. Check your connection or open the browser console.</p>'); }, 6000);
</script>
<script type="module">
// ── NÚCLEO: camera, lights, orbit, labels, views, theme and the note's commands. Do not touch. ──
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const NUCLEO_CSS = `
:root { color-scheme: light dark;
  --bg: #fbfbfa; --fg: #202326; --muted: #696f75; --accent: #0b6bcb;
  --red: #b3261e; --blue: #0b6bcb; --green: #2c6e3a; --orange: #a65a12; --magenta: #a2367f; --cyan: #0f7a80;
  --sans: system-ui, "Noto Sans", sans-serif; --mono: ui-monospace, "Noto Sans Mono", monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) {
  --bg: #16181b; --fg: #e3e5e7; --muted: #9aa1a8; --accent: #6cb0ff;
  --red: #ff8a80; --blue: #6cb0ff; --green: #8bd49a; --orange: #f0a35e; --magenta: #e39bd0; --cyan: #6fd0d6; } }
:root[data-tema="oscuro"] {
  --bg: #16181b; --fg: #e3e5e7; --muted: #9aa1a8; --accent: #6cb0ff;
  --red: #ff8a80; --blue: #6cb0ff; --green: #8bd49a; --orange: #f0a35e; --magenta: #e39bd0; --cyan: #6fd0d6; }
:root { --mesa: color-mix(in srgb, var(--fg) 6.5%, var(--bg)); --hueco: color-mix(in srgb, var(--fg) 2%, var(--bg));
  --linea: color-mix(in srgb, var(--fg) 18%, transparent); }
html, body { height: 100%; margin: 0; }
body { background: var(--mesa); color: var(--fg); font-family: var(--sans); line-height: 1.5; }
.escena3d { position: relative; display: flex; flex-direction: column; height: 100%; }
.escena3d .lienzo3d { position: relative; flex: 1; min-height: 12rem; }
.escena3d .lienzo3d canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; cursor: grab; }
.escena3d .lienzo3d canvas:active { cursor: grabbing; }
.escena3d .rotulos3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.etiqueta3d { font-size: .78rem; font-weight: 600; color: var(--c, var(--fg)); background: color-mix(in srgb, var(--bg) 82%, transparent); padding: .05rem .45rem; border-radius: 6px; white-space: nowrap; }
.escena3d .mandos3d { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; padding: .4rem .6rem .6rem; }
.escena3d .mandos3d:empty { display: none; }
.escena3d .fallo3d { color: var(--red); font-size: .9rem; padding: 1rem .6rem; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--hueco); border-radius: 10px; }
.seg button { font: inherit; font-size: .85rem; padding: .15rem .7rem; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.escena3d .pantalla3d { position: absolute; top: .45rem; right: .45rem; z-index: 20; width: 2rem; height: 2rem; display: grid; place-items: center; padding: 0; border: 1px solid var(--linea); border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer; }
.escena3d .pantalla3d[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.escena3d:fullscreen { background: var(--bg); }
`;

const poco = matchMedia("(prefers-reduced-motion: reduce)");
const url = new URLSearchParams(location.search);
const tFijo = url.has("t") ? parseFloat(url.get("t")) : null;
// The note that embeds the scene sends it commands and colors (embed.js); only the parent frame is handled.
const incrustada = window.parent !== window;

if (url.get("tema") === "claro" || url.get("tema") === "oscuro") document.documentElement.dataset.tema = url.get("tema");
const estilo = document.createElement("style");
estilo.textContent = NUCLEO_CSS;
document.head.prepend(estilo);

// #diag and body[data-listo] signal the first frame or the failure.
function diag(texto, listo) {
  let d = document.getElementById("diag");
  if (!d) { d = document.createElement("div"); d.id = "diag"; d.hidden = true; document.body.append(d); }
  if (listo && d.textContent.startsWith("OK")) return;
  d.textContent = texto;
  if (listo) {
    document.body.dataset.listo = "1";
    // In the capture, the page clock runs ahead of the Three.js download, so the notice may appear too early.
    document.querySelectorAll(".sin-arrancar").forEach((m) => m.remove());
  }
}

function hex(css, dentro) {
  const p = document.createElement("span");
  p.style.color = css;
  dentro.append(p);
  const c = getComputedStyle(p).color;
  p.remove();
  const ctx = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = c;
  ctx.fillRect(0, 0, 1, 1);
  const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
  return "#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join("");
}
const NOMBRES = ["bg", "fg", "muted", "mesa", "accent", "blue", "red", "green", "orange", "magenta", "cyan"];
function leerColores(el) {
  const c = {};
  for (const n of NOMBRES) c[n] = hex(`var(--${n})`, el);
  c.oscuro = new THREE.Color(c.bg).getHSL({}).l < 0.5;
  return c;
}

async function arrancar(fn, cont = document.querySelector(".escena3d")) {
  const id = cont.id || "escena";
  const lienzo = document.createElement("div");
  lienzo.className = "lienzo3d";
  const rotulosEl = document.createElement("div");
  rotulosEl.className = "rotulos3d";
  lienzo.append(rotulosEl);
  const mandos = document.createElement("div");
  mandos.className = "mandos3d";
  cont.append(lienzo, mandos);

  const escena = new THREE.Scene();
  const camara = new THREE.PerspectiveCamera(40, 1.6, 0.1, 200);
  const render = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  render.setPixelRatio(Math.min(devicePixelRatio, 2));
  render.setClearColor(0x000000, 0);
  render.shadowMap.enabled = true;
  render.shadowMap.type = THREE.PCFShadowMap;
  render.domElement.setAttribute("role", "img");
  render.domElement.setAttribute("aria-label", cont.getAttribute("aria-label") || document.title);
  lienzo.prepend(render.domElement);
  const rotulos = new CSS2DRenderer({ element: rotulosEl });
  const orbita = new OrbitControls(camara, render.domElement);
  // Embedded in a note, the wheel scrolls the note: zooming with it would trap the scroll.
  orbita.enableZoom = !incrustada;
  orbita.enableDamping = !poco.matches;
  orbita.dampingFactor = 0.08;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 1.1);
  const sol = new THREE.DirectionalLight(0xffffff, 1.8);
  sol.position.set(4, 9, 6);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  Object.assign(sol.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, far: 40 });
  escena.add(hemi, sol);

  let pedido = true;
  const pedir = () => { pedido = true; };
  orbita.addEventListener("change", pedir);

  // Lab (data-modo="laboratorio"): ⛶ fullscreen button and the format the module reads.
  const laboratorio = cont.dataset.modo === "laboratorio";
  const formatos = [];
  let formato = "compacto", boton = null;
  const medirFormato = () => {
    const nuevo = document.fullscreenElement === cont || (!incrustada && innerWidth >= 1100) ? "completo" : "compacto";
    boton?.setAttribute("aria-pressed", String(document.fullscreenElement === cont));
    if (nuevo === formato) return;
    formato = nuevo;
    formatos.forEach((f) => f(formato));
    pedir();
  };
  if (laboratorio) {
    if (url.get("formato") === "completo" || url.get("formato") === "compacto") formato = url.get("formato");
    else medirFormato();
    boton = document.createElement("button");
    boton.type = "button";
    boton.className = "pantalla3d";
    boton.title = "Fullscreen";
    boton.setAttribute("aria-label", "Fullscreen");
    boton.setAttribute("aria-pressed", "false");
    boton.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
    cont.append(boton);
    // Embedded, the iframe needs allowfullscreen: without it the browser refuses, and here we say why.
    boton.addEventListener("click", () => (document.fullscreenElement === cont ? document.exitFullscreen()
      : cont.requestFullscreen().catch((e) => console.error(`escena3d: fullscreen not available (${e.message})${incrustada ? ": the iframe is missing allowfullscreen" : ""}`))));
    document.addEventListener("fullscreenchange", medirFormato);
    if (!url.has("formato")) addEventListener("resize", medirFormato);
  }

  let colores = leerColores(cont);
  const temaFns = [];
  const k = {
    THREE, escena, camara, render, orbita, sol, hemi, contenedor: cont, mandos, pedir,
    get colores() { return colores; },
    get formato() { return formato; },
    alCambiarFormato(f) { formatos.push(f); f(formato); },
    alCambiarTema(f) { temaFns.push(f); f(colores); },
    etiqueta(obj, texto, { color = "fg", alto = 0 } = {}) {
      const d = document.createElement("div");
      d.className = "etiqueta3d";
      d.textContent = texto;
      d.style.setProperty("--c", `var(--${color})`);
      const o = new CSS2DObject(d);
      o.position.y = alto;
      obj.add(o);
      return o;
    },
    // Shadow on the table without drawing a floor: only the shadow is visible.
    sombraSuelo(y = 0, lado = 20) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(lado, lado), new THREE.ShadowMaterial({ opacity: 0.18 }));
      m.rotation.x = -Math.PI / 2;
      m.position.y = y;
      m.receiveShadow = true;
      escena.add(m);
      return m;
    },
    vistas: {},
    mirarDesde(clave) {
      const v = k.vistas[clave];
      if (!v) return;
      const mira = new THREE.Vector3(...(v.mira || [0, 0, 0]));
      // Vertical fov: in a gap narrower than the base aspect, width would be lost; the camera pulls back.
      const f = Math.min(2, Math.max(1, (v.aspecto || 1.6) / camara.aspect));
      camara.position.set(...v.pos).sub(mira).multiplyScalar(f).add(mira);
      orbita.target.copy(mira);
      orbita.update();
      vistaActual = clave;
      mandos.querySelectorAll("[data-vista]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.vista === clave));
      pedir();
    },
  };
  let vistaActual = null;

  const api = (await fn(k)) || {};
  const claves = Object.keys(k.vistas);
  if (claves.length > 1) {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "View");
    for (const c of claves) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.vista = c;
      b.textContent = k.vistas[c].nombre || c;
      b.addEventListener("click", () => k.mirarDesde(c));
      seg.append(b);
    }
    mandos.prepend(seg);
  }

  const ajustar = () => {
    const w = lienzo.clientWidth, h = lienzo.clientHeight;
    if (!w || !h) return;
    render.setSize(w, h, false);
    rotulos.setSize(w, h);
    camara.aspect = w / h;
    camara.updateProjectionMatrix();
    if (vistaActual) k.mirarDesde(vistaActual);
    pedir();
  };
  new ResizeObserver(ajustar).observe(lienzo);
  ajustar();
  if (claves.length) k.mirarDesde(k.vistas[url.get("vista")] ? url.get("vista") : claves[0]);

  const retemar = () => { colores = leerColores(cont); temaFns.forEach((f) => f(colores)); pedir(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retemar);

  const ordenar = (d) => { if (d.vista) k.mirarDesde(d.vista); api.orden?.(d); pedir(); };
  // Messages from the note (embed.js): {tipo:"tema", tema, colores} and {tipo:"orden", orden}.
  addEventListener("message", (e) => {
    if (!incrustada || e.source !== window.parent || !e.data) return;
    const m = e.data;
    if (m.tipo === "tema") {
      const raiz = document.documentElement;
      if (m.tema === "claro" || m.tema === "oscuro") raiz.dataset.tema = m.tema;
      for (const [n, v] of Object.entries(m.colores || {})) if (NOMBRES.includes(n) && v) raiz.style.setProperty(`--${n}`, v);
      retemar();
    } else if (m.tipo === "orden" && m.orden) ordenar(m.orden);
  });
  if (incrustada) window.parent.postMessage({ tipo: "escena3d-lista", id }, "*");

  const anima = typeof api.actualizar === "function";
  const reloj = new THREE.Timer();
  let t = tFijo ?? 0, fotogramas = 0;
  if (anima) api.actualizar(t);
  const tick = () => {
    reloj.update();
    const dt = Math.min(reloj.getDelta(), 0.1);
    // animando() (optional) keeps the scene still when the module has nothing running: without it, it always moves.
    const mueve = anima && (api.animando?.() ?? true) && !poco.matches && tFijo === null;
    if (mueve) { t += dt; api.actualizar(t); }
    orbita.update();
    if (!mueve && !pedido) return;
    pedido = false;
    render.render(escena, camara);
    rotulos.render(escena, camara);
    api.despues?.();
    if (++fotogramas === 1) {
      const txt = `escena3d: ${id} ready three=r${THREE.REVISION} triangles=${render.info.render.triangles}`;
      console.info(txt);
      diag("OK " + txt, true);
    }
  };

  // Paused off-screen: without a loop there is no GPU cost.
  let activa = false;
  new IntersectionObserver(([e]) => {
    if (e.isIntersecting === activa) return;
    activa = e.isIntersecting;
    if (activa) { reloj.reset?.(); pedir(); render.setAnimationLoop(tick); }
    else render.setAnimationLoop(null);
  }).observe(cont);
  return { orden: ordenar };
}

function arrancarEscena(fn) {
  const cont = document.querySelector(".escena3d");
  return arrancar(fn, cont).catch((e) => {
    const m = document.createElement("p");
    m.className = "fallo3d";
    m.textContent = /fetch|import|module/i.test(e.message) ? "Could not load the 3D scene. Check your connection." : "The 3D scene failed: " + e.message;
    cont.append(m);
    console.error(`escena3d: ${e.message}`);
    diag(`ERROR escena3d: ${e.message}`);
  });
}
// ── end of NÚCLEO ──

// What goes between the CONTENIDO markers is the scene; the rest (scaffolding) is not touched.

const CSS = `

.lab-cont .lab-raiz { position: absolute; inset: 0; z-index: 2; pointer-events: none; color: var(--fg); font-size: .9rem; line-height: 1.45; }
.lab-cont .lab-raiz[data-formato="compacto"] { display: none; }

.lab-cont .lab-boton:hover { background: var(--mesa); }
.lab-cont .lab-boton[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; } /* neutral: the note's accent can be a color with meaning */
.lab-cont .lab-boton:focus-visible, .lab-cont .lab-control input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.lab-cont .lab-control label b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

.lab-cont .lab-corta b { font-weight: 650; }
.lab-cont[data-formato="completo"] .lab-corta { display: none; }
`;

function montar(k) {
  const { THREE, escena, camara, render, orbita, hemi, sol } = k;
  const url = new URLSearchParams(location.search);
  const tFijo = url.has("t") ? parseFloat(url.get("t")) : null;   // ?t= freezes the frame (captures)

  // ── ANDAMIAJE (start): same as in the skill template ──────────────────────────
  const el = (etiqueta, clase, html) => {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    if (html !== undefined) e.innerHTML = html;
    return e;
  };
  const num = (v, d = 1) => new Intl.NumberFormat("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
  const hex = (n) => "#" + n.toString(16).padStart(6, "0");

  const cont = k.contenedor;
  cont.classList.add("lab-cont");
  const lienzo = render.domElement.parentElement;
  const estilo = el("style");
  estilo.textContent = CSS;
  cont.append(estilo);

  cont.append(superposicion);
  const mandosFila = k.mandos;

  // ── Temas ──
  // Semantic colors: the scene asks for 'azul' or 'base', never a hex. The scene's own colors are added with ampliarTemas().
  const TEMAS = {
    oscuro: {
      base: 0x3b414b,
      azul: 0x5aa2ff, naranja: 0xff9f4a, verde: 0x45c48f, rojo: 0xff6b6b,
      amarillo: 0xf2c14e, violeta: 0xa98bff, gris: 0x6f7987, metal: 0xaab3c0,
      hemiCielo: 0xffffff, hemiSuelo: 0x5b6270, hemi: 0.75, sol: 1.7,
    },
    claro: {
      base: 0xbfc5ce,
      azul: 0x2a6bd1, naranja: 0xd96d16, verde: 0x1b8f5d, rojo: 0xd13a3a,
      amarillo: 0xc99609, violeta: 0x7650d0, gris: 0x9099a6, metal: 0x8d97a4,
      hemiCielo: 0xffffff, hemiSuelo: 0x9aa1ad, hemi: 0.85, sol: 1.5,

  };
  const SEMANTICOS = ["azul", "naranja", "verde", "rojo", "amarillo", "violeta", "gris"];
  const clavesPropias = [];
  let tema = "oscuro";
  // Same keys in both themes: a color that exists in only one comes out undefined when switching, and fails silently.
  function ampliarTemas({ claro, oscuro } = {}) {
    if (!claro || !oscuro) throw new Error("ampliarTemas() needs { claro: {…}, oscuro: {…} }");
    const dif = (a, b, en, falta) => Object.keys(a).filter((c) => !(c in b)).map((c) => `"${c}" is in ${en} but missing in ${falta}`);
    const problemas = [...dif(claro, oscuro, "claro", "oscuro"), ...dif(oscuro, claro, "oscuro", "claro"),
      ...Object.keys(claro).filter((c) => c in TEMAS.claro).map((c) => `"${c}" already exists in TEMAS and cannot be overridden`)];
    if (problemas.length) throw new Error("ampliarTemas(): " + problemas.join("; "));

  const colorDe = (nombre) => hex(TEMAS[tema][nombre]);

  const temaFns = [];

      ...opciones, color: TEMAS[tema][clave],

  }

  function alCambiarTema(fn) { temaFns.push(fn); fn(tema, TEMAS[tema]); }

    const c = { texto: k.colores.fg, tenue: k.colores.muted, fondo: k.colores.bg, borde: k.colores.muted };
    for (const n of [...SEMANTICOS, ...clavesPropias]) c[n] = hex(TEMAS[tema][n]);
    return c;
  }

  // ── State: single source of truth ──
  // Always starts in the initial state (the first moment); ?e=key:value,… overrides it for captures.
  let estado = null, anterior = null;

  const requerirEstado = (quien) => { if (!estado) throw new Error(`${quien}() was called before definirEstado()`); };
  function definirEstado(inicial) {
    estado = { ...inicial };
    for (const par of (url.get("e") || "").split(",").filter(Boolean)) {
      const i = par.indexOf(":"); if (i < 0) continue;
      const c = par.slice(0, i).trim(), v = par.slice(i + 1).trim();
      estado[c] = v === "true" ? true : v === "false" ? false : (v !== "" && !isNaN(+v)) ? +v : v;
    }
    anterior = null;
  }

    requerirEstado("cambiar");

  function alCambiar(fn) { alCambiarFns.push(fn); }

  // ── Controls ──
  const grupos = [], deslizadores = [], capas = [], atajos = [], notasAyuda = [];
  let elPrincipal = null;
  const efectoDeOpcion = (clave, o) => {
    const r = { ...(o.valor !== undefined ? { [clave]: o.valor } : {}), ...(o.fija || {}) };
    if (!Object.keys(r).length) throw new Error(`grupo("${clave}"): option "${o.texto}" needs a value or fixed`);

  const opcionActiva = (r) => Object.entries(r).every(([c, v]) => String(estado[c]) === String(v));
  // Segmented buttons. Option = { texto, tecla?, valor?, fija? }. { principal: true } puts it in the bottom row
  // in compact (and at the top of the panel in full).
  function grupo(rotulo, clave, opciones, { principal = false } = {}) {
    requerirEstado("grupo");

    seg.setAttribute("role", "group"); seg.setAttribute("aria-label", rotulo);
    caja.append(el("span", "lab-rotulo", rotulo), seg);
    const efectos = opciones.map((o) => efectoDeOpcion(clave, o));
    const botones = opciones.map((o, i) => {
      const b = el("button", "lab-boton"); b.type = "button"; b.textContent = o.texto;
      b.addEventListener("click", () => cambiar(efectos[i]));
      seg.append(b);
      if (o.tecla) atajos.push({ tecla: o.tecla, texto: `${rotulo}: ${o.texto}`, fn: () => cambiar(efectos[i]) });
      return b;

    if (principal) { elPrincipal = caja; colocarPrincipal(); } else controles.append(caja);
    ajustarGrupos();
  }
  // Lays out each group: one row; if it does not fit, 2, 3… even rows, the first arrangement with no overflow.
  function ajustarGrupos() {
    const mcd = (a, b) => (b ? mcd(b, a % b) : a);
    for (const seg of k.contenedor.querySelectorAll(".lab-seg")) {
      const bs = [...seg.children], n = bs.length;
      if (n < 2 || !seg.getClientRects().length) continue;
      const cabe = () => seg.scrollWidth <= seg.clientWidth + 1 && bs.every((b) => b.scrollWidth <= b.clientWidth + 1);
      const poner = (kf) => {
        seg.classList.toggle("fil", kf > 0);
        const m = kf ? n - kf * (Math.ceil(n / kf) - 1) : 0;
        const cols = kf ? kf * m / mcd(kf, m) : 1;
        seg.style.setProperty("--c", cols);
        bs.forEach((b, i) => { const span = kf ? cols / (i >= n - m ? m : kf) : 1; b.style.gridColumn = span > 1 ? `span ${span}` : ""; });
      };
      poner(0);
      for (let filas = 2, previo = n; filas <= n && !cabe(); filas++) {

  }
  function colocarPrincipal() {

  function deslizador(rotulo, clave, { min = 0, max = 1, paso = 0.01, formato: fmt = (v) => num(v, 2), tambien = {} } = {}) {
    requerirEstado("deslizador");
    const d = el("div", "lab-control", `<label><span></span><b></b></label><input type="range" min="${min}" max="${max}" step="${paso}">`);

  function capa(rotulo, clave, tecla) {

    b.addEventListener("click", () => cambiar({ [clave]: !estado[clave] }));

  }

  const cifras = [];
  function cabecera({ antetitulo, titulo, gancho }) {
    cabeceraEl.innerHTML = `<p class="lab-antetitulo"></p><h1></h1><p class="lab-gancho"></p>`;
    cabeceraEl.querySelector(".lab-antetitulo").textContent = antetitulo;

    cabeceraEl.querySelector(".lab-gancho").textContent = gancho;

    c.querySelector(".lab-rotulo").textContent = rotulo;

  let fnCorta = null;
  const cortaEl = el("span", "lab-corta");
  function lineaCorta(fn) { fnCorta = fn; k.mandos.append(cortaEl); }

  const etiquetas = [];
  // Label anchored to a 3D object. `texto`: string or function (e, t) of the state and time. `color`: semantic name from the theme.
  // `lado`: 'izq' | 'der' beside the anchor. `opcional`: hidden in compact. `prioridad`: the highest wins if they overlap.
  function etiqueta(objeto, texto, { color = "azul", alto = 0, lado = "", opcional = false, prioridad = 0 } = {}) {
    const o = k.etiqueta(objeto, "", { alto });
    const div = o.element;
    div.className = "etiqueta3d lab-etiqueta" + (opcional ? " opc" : "");

  function resolverEtiquetas() {
    if (!etiquetas.length) return;
    const L = lienzo.getBoundingClientRect();
    const paneles = [...cont.querySelectorAll(".lab-izq > *, .lab-mandos, .lab-ayuda:not([hidden]), .pantalla3d")]
      .map((p) => p.getBoundingClientRect()).filter((r) => r.width && r.height);
    const lista = [], ahora = performance.now();

    const puestas = [];

  const graficos = [];

      if (g.canvas.width !== w || g.canvas.height !== h) { g.canvas.width = w; g.canvas.height = h; }

  function pintarTextos() {
    if (fnRelato) escribirSi(relatoEl, "innerHTML", fnRelato(estado, tFlujo));
    if (fnCorta) escribirSi(cortaEl, "innerHTML", fnCorta(estado, tFlujo));
    for (const c of cifras) {
      const r = c.fn(estado, tFlujo);
      escribirSi(c.valor, "innerHTML", `${r.valor}${r.unidad ? `<small>${r.unidad}</small>` : ""}`);

  // ── Help ──
  function ayuda(html) { notasAyuda.push(html); }
  function pintarAyuda() {

  // ── Transitions ──

  const transiciones = [];

  function suavizar(objeto, destinos, ms = 400, alActualizar) {
    if (!arrancado || tFijo !== null || ms <= 0) {

    const previa = transiciones.findIndex((x) => x.objeto === objeto);
    if (previa >= 0) transiciones.splice(previa, 1);

  // ── Animation ──

    animadaVista = ANIMADA;
    botonPausa.hidden = !ANIMADA;
    pintarPausa();
    k.pedir();
  }

  // ── Refresh ──
  function refrescar() {
    for (const fn of alCambiarFns) fn(estado, anterior);
    animar(tFlujo, estado);   // also when still: places the pieces for this moment
    sincronizarPausa();
    pintarMandos(); pintarTextos(); pintarGrafico();
    marcarSombras();
  }
  // Theme colors: the core's for the text and the table; the scene's for everything else.
  function aplicarTema(nuevo) {
    tema = nuevo;
    const T = TEMAS[tema];
    for (const [m, clave] of materiales) m.color.setHex(T[clave]);
    hemi.color.setHex(T.hemiCielo); hemi.groundColor.setHex(T.hemiSuelo);
    hemi.intensity = T.hemi; sol.intensity = T.sol;
    for (const e of etiquetas) e.div.style.setProperty("--c", colorDe(e.color));
    for (const fn of temaFns) fn(tema, T);
    pintarGrafico();
    marcarSombras();
  }
  function aplicarFormato(nuevo) {
    formato = nuevo;
    superposicion.dataset.formato = formato;
    cont.dataset.formato = formato;
    orbita.enableZoom = true;
    if (formato === "compacto") ayudaEl.hidden = true;
    colocarPrincipal();
    ajustarGrupos();
    if (arrancado) mirarDesde(vistaActual);
    pintarGrafico();
    zonaClave = "";
    k.pedir();
  }

  // ── ANDAMIAJE (end of the upper part) ──────────────────────────────────────────
  orbita.maxPolarAngle = Math.PI * 0.49;   // CONTENIDO can change these limits
  orbita.minDistance = 3; orbita.maxDistance = 40;

  // ── CONTENIDO (start) ─────────────────────────────────────────────────────────────
  // Minimal example: a sphere that changes color with the state and rotates if animated. Replace with the scene from step 1.
  cabecera({ antetitulo: "AREA · TOPIC", titulo: "Lab title", gancho: "The question the scene answers." });
  definirEstado({ modo: "a", giro: false });

  const matA = mat("azul"), matB = mat("naranja");
  const esfera = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), matA);
  esfera.castShadow = true;
  esfera.position.y = 1;
  escena.add(esfera);
  pedestal({ ancho: 4, fondo: 4, alto: 0.3 });
  etiqueta(esfera, (e) => `Mode · ${e.modo}`, { color: "naranja", alto: 1.4, prioridad: 1 });

  grupo("Mode", "modo", [
    { valor: "a", texto: "Blue", tecla: "1" },
    { valor: "b", texto: "Orange", tecla: "2" },
  ], { principal: true });
  capa("Spin", "giro", "g");

  cifra("Mode", (e) => ({ valor: e.modo, sub: "current state" }));
  relato((e) => `With mode <b>${e.modo}</b> the sphere is ${e.modo === "a" ? "blue" : "orange"}.`);
  lineaCorta((e) => `Mode <b>${e.modo}</b>: sphere ${e.modo === "a" ? "blue" : "orange"}`);

  alCambiar((e) => {
    esfera.material = e.modo === "a" ? matA : matB;
    ANIMADA = !!e.giro;
  });
  animar = (t) => { esfera.rotation.y = t * 0.6; };   // pure function of t

  VISTAS = { inicial: { pos: [0, 4, 7], mira: [0, 0.5, 0] } };
  ASPECTO_BASE = 1.72;
  // ── CONTENIDO (end) ────────────────────────────────────────────────────────────────

  // ── ANDAMIAJE (start-up) ───────────────────────────────────────────────────────────
  k.render.shadowMap.autoUpdate = false;
  k.alCambiarTema((c) => aplicarTema(c.oscuro ? "oscuro" : "claro"));
  k.alCambiarFormato(aplicarFormato);

  for (const clave of vistasVisibles()) {
    const b = el("button", "lab-boton", clave[0].toUpperCase() + clave.slice(1));
    b.type = "button"; b.dataset.vista = clave;
    b.addEventListener("click", () => mirarDesde(clave));
    fila.append(b);
  }
  botonPausa.addEventListener("click", () => { pausado = !pausado; pintarPausa(); k.pedir(); });
  atajos.push({ tecla: " ", texto: "Pause", activo: () => ANIMADA, fn: () => { if (ANIMADA) botonPausa.click(); } });
  atajos.push({ tecla: "0", texto: "Initial view", fn: () => mirarDesde(vistaBase()) });
  // Shortcuts: only in fullscreen. Inside the page, the keys belong to the page.
  addEventListener("keydown", (ev) => {
    if (formato !== "completo" || ev.ctrlKey || ev.metaKey || ev.altKey || ev.target.matches?.("input")) return;
    if (ev.key === " " && ev.target.tagName === "BUTTON") return;   // a focused button is pressed with its own space bar
    if (ev.key === "?" || ev.key === "h") { alternarAyuda(); return; }
    const a = atajos.find((x) => x.tecla === ev.key && (!x.activo || x.activo()));
    if (a) { ev.preventDefault(); a.fn(); }
  });

  // First refresh before starting: the initial placement of the cables is immediate, with no transition.
  refrescar();
  arrancado = true;
  encuadrar();
  mirarDesde(VISTAS[url.get("vista")] ? url.get("vista") : vistaBase());
  zonaClave = "";
  comprobarZona();

  return {
    // Animation requested from the core only while something moves: flow running or a pending transition.
    animando: () => transiciones.length > 0 || (ANIMADA && !pausado),
    actualizar(tt) {
      const dt = tPrev === null ? 0 : tt - tPrev;
      tPrev = tt;
      if (ANIMADA && !pausado) tFlujo += dt;
      if (avanzarTransiciones()) marcarSombras();
      if (ANIMADA) animar(tFlujo, estado);
      if (ANIMADA && !pausado && tt - tTextos > 0.1) { tTextos = tt; pintarTextos(); pintarGrafico(); }
    },
    despues() { resolverEtiquetas(); comprobarZona(); },
    // Commands from the data-3d buttons: state keys. `vista` is resolved by the core.
    orden(d) {
      const cambios = {};
      for (const c of Object.keys(d)) if (estado && c in estado) cambios[c] = d[c];
      if (d.vista && VISTAS[d.vista]) mirarDesde(d.vista);
      if (Object.keys(cambios).length) cambiar(cambios);
    },
  };
}

arrancarEscena(montar);
</script>
</body>
</html>
